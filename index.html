<title>Workout Calendar</title>

<style>
:root {
  --cardio:#b91c1c; --cardio-bg:#fee2e2;
  --strength:#1a5fa8; --strength-bg:#dbeafe;
  --flex:#166534; --flex-bg:#dcfce7;
  --rest:#4b5563; --rest-bg:#f3f4f6;
  --border:#e5e7eb; --border-dk:#d1d5db;
  --text:#111827; --muted:#9ca3af; --mid:#6b7280;
  --accent:#111827;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f9fafb;padding:24px;color:var(--text);}

.controls{display:flex;align-items:center;gap:12px;margin-bottom:20px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;flex-wrap:wrap;}
.controls label{font-size:11px;font-weight:500;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;}
.controls select{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--text);background:#fff;border:1px solid var(--border-dk);border-radius:6px;padding:6px 10px;cursor:pointer;outline:none;}
.controls select:focus{border-color:var(--accent);}
.btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;transition:opacity .15s;}
.btn-dark{background:var(--accent);color:#fff;margin-left:auto;}
.btn-outline{background:#fff;color:var(--text);border:1px solid var(--border-dk);}
.btn:hover{opacity:.8;}

.page{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;}

.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 24px 16px;border-bottom:1px solid var(--border);}
.month-title{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:.04em;color:var(--text);}
.header-meta{display:flex;flex-direction:column;gap:6px;text-align:right;}
.weight-row{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.weight-row label{font-size:11px;color:var(--mid);text-transform:uppercase;letter-spacing:.05em;}
.weight-input{width:58px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border:none;border-bottom:1.5px solid var(--border-dk);padding:2px 4px;text-align:center;background:transparent;outline:none;color:var(--text);}
.quote-wrap{padding:10px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.quote-wrap::before{content:'"';font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--border-dk);line-height:1;}
.quote-input{flex:1;font-family:'DM Sans',sans-serif;font-size:13px;font-style:italic;color:var(--mid);border:none;outline:none;background:transparent;}
.quote-input::placeholder{color:#d1d5db;}

.day-headers{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);}
.day-hdr{padding:8px 0;text-align:center;font-size:11px;font-weight:500;color:var(--mid);text-transform:uppercase;letter-spacing:.08em;}

.grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px 7px;min-height:108px;display:flex;flex-direction:column;gap:4px;position:relative;}
.cell:nth-child(7n){border-right:none;}
.cell.empty{background:#fafafa;}
.cell.today{background:#fffbeb;}
.date-num{font-size:11px;font-weight:500;color:var(--mid);margin-bottom:2px;}
.cell.today .date-num{background:var(--accent);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

.types-row{display:flex;gap:4px;}
.type-sel{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;border:none;border-radius:4px;padding:2px 5px;cursor:pointer;outline:none;flex:1;min-width:0;}

.desc-input{font-family:'DM Sans',sans-serif;font-size:10px;color:var(--text);border:none;border-bottom:1px solid var(--border);background:transparent;outline:none;width:100%;resize:none;line-height:1.4;padding:1px 0;flex:1;}
.desc-input::placeholder{color:var(--muted);}

.done-row{display:flex;align-items:center;gap:5px;margin-top:auto;}
.done-row label{font-size:10px;color:var(--muted);}
.done-row input[type=checkbox]{accent-color:var(--accent);width:12px;height:12px;cursor:pointer;}

.footer{padding:12px 24px;border-top:1px solid var(--border);}
.notes-label{font-size:11px;font-weight:500;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.notes-area{width:100%;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;resize:none;outline:none;line-height:1.6;}
.notes-area::placeholder{color:var(--muted);}

.legend{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mid);}
.leg-dot{width:10px;height:10px;border-radius:3px;}

/* Type color application */
select.t-Cardio{background:var(--cardio-bg);color:var(--cardio);}
select.t-Strength{background:var(--strength-bg);color:var(--strength);}
select.t-Flexibility{background:var(--flex-bg);color:var(--flex);}
select.t-Rest{background:var(--rest-bg);color:var(--rest);}

@media print {
  body{background:#fff;padding:0;}
  .controls{display:none;}
  .page{border:none;border-radius:0;box-shadow:none;}
  @page{size:landscape;margin:8mm;}
  .cell{min-height:90px;}
  .desc-input,.notes-area,.quote-input{-webkit-appearance:none;}
}
</style>

function pad(n){return String(n).padStart(2,'0');}
function dateKey(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`;}

function applyTypeColor(sel){
  sel.className='type-sel';
  const c=TYPE_COLORS[sel.value];
  if(c) sel.classList.add(c);
}

function buildGrid(monthIdx){
  const {label,year,month}=MONTHS[monthIdx];
  document.getElementById('monthTitle').textContent=label;
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';

  const today=new Date();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();

  // blank cells
  for(let i=0;i<firstDay;i++){
    const c=document.createElement('div');
    c.className='cell empty';
    grid.appendChild(c);
  }

  for(let d=1;d<=daysInMonth;d++){
    const key=dateKey(year,month,d);
    const plan=PLAN[key]||{t1:'',t2:'',desc:''};
    const isToday=(today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d);

    const cell=document.createElement('div');
    cell.className='cell'+(isToday?' today':'');

    // Date number
    const dn=document.createElement('div');
    dn.className='date-num';
    dn.textContent=d;
    cell.appendChild(dn);

    // Two type selectors
    const tr=document.createElement('div');
    tr.className='types-row';
    [plan.t1||'—', plan.t2||'—'].forEach(val=>{
      const s=document.createElement('select');
      s.className='type-sel';
      TYPES.forEach(t=>{
        const o=document.createElement('option');
        o.value=t; o.textContent=t;
        if(t===val) o.selected=true;
        s.appendChild(o);
      });
      applyTypeColor(s);
      s.addEventListener('change',()=>applyTypeColor(s));
      tr.appendChild(s);
    });
    cell.appendChild(tr);

    // Description textarea
    const ta=document.createElement('textarea');
    ta.className='desc-input';
    ta.rows=3;
    ta.placeholder='Workout notes…';
    ta.value=plan.desc||'';
    cell.appendChild(ta);

    // Done checkbox
    const dr=document.createElement('div');
    dr.className='done-row';
    const cb=document.createElement('input');
    cb.type='checkbox';
    const lbl=document.createElement('label');
    lbl.textContent='Done';
    dr.appendChild(cb);
    dr.appendChild(lbl);
    cell.appendChild(dr);

    grid.appendChild(cell);
  }
}

document.getElementById('selMonth').addEventListener('change',function(){
  buildGrid(parseInt(this.value));
});

buildGrid(0);
</script>
</body>
</html>
